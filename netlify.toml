[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/notice"
  to = "/notice/index.html"
  status = 200

[[redirects]]
  from = "/qa"
  to = "/qa/index.html"
  status = 200

[[redirects]]
  from = "/written"
  to = "/written/index.html"
  status = 200

[[redirects]]
  from = "/interview"
  to = "/interview/index.html"
  status = 200
